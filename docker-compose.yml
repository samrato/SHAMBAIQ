services:
  mongodb:
    image: mongo:latest
    container_name: shambaiq_db
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: shambaiq_backend
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/shambaiq
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - WEATHERAI_API_KEY=${WEATHERAI_API_KEY}
      - WEATHERAI_BASE_URL=${WEATHERAI_BASE_URL}
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: shambaiq_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:80"
    depends_on:
      - backend

volumes:
  mongo_data:
