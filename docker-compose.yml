services:
  mongodb:
    image: mongo:latest
    container_name: shambaiq_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: shambaiq_backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/shambaiq
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - WEATHERAI_API_KEY=${WEATHERAI_API_KEY}
      - WEATHERAI_BASE_URL=${WEATHERAI_BASE_URL}
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: shambaiq_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
